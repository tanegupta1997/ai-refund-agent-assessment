version: "3.8"

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./data/refund_agent.db
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MODEL_NAME: ${MODEL_NAME:-gpt-4o-mini}
      ADMIN_SECRET: ${ADMIN_SECRET:-changeme}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
    volumes:
      - refund_agent_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_ADMIN_SECRET: ${ADMIN_SECRET:-changeme}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  refund_agent_data:
